# CI pipeline: runs on GitHub's Linux machines for pull requests (not drafts)
# and for pushes to main (i.e. after a merge).
#
# One job, the same command as on a laptop: `nox`
#   unit         -> fast tests, no server; if they fail, nox stops here (fast feedback)
#   integration  -> starts the server, API + CLI + UI tests (parallel, then serial), stops it
# One Allure report for all of them, plus the logs, is uploaded as a
# downloadable artifact on each run's page.
name: tests

on:
  pull_request:
    # opened/updated/reopened, plus a draft being marked "Ready for review"
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    # Skip draft PRs.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            server/requirements.txt
      - uses: actions/setup-node@v4          # for the Allure report tool
        with:
          node-version: "20"
      - name: Install nox and Allure
        run: |
          python -m pip install nox
          npm install -g allure
      - name: Unit, then API + CLI + UI tests
        # The tests create the self-signed certificate, start the server with the
        # demo user (tests/test.env) and stop it. Chromium is installed with its
        # system libraries, since CI is set on GitHub's machines.
        run: nox
      - name: Upload reports
        if: always()                         # also (especially) when tests failed
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
