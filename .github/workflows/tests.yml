# CI pipeline: runs on GitHub's Linux machines on every push and pull request.
#   unit        -> fast tests, no server (~1 min)
#   integration -> only if unit passed: builds the Docker image, starts the
#                  server, runs the API, CLI and Playwright tests, stops it
# Reports are uploaded as a downloadable artifact on each run's page.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            server/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python scripts/run_tests.py unit
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: reports/

  integration:
    needs: unit                     # quality gate: skipped if a unit test fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            server/requirements.txt
      - name: Full run, exactly as in the README (fresh machine)
        # --install: test dependencies, Chromium and the self-signed cert. Then
        # unit tests again (~1 s), start the server, API + CLI + UI tests, stop it.
        # No MSG_* variables are set, so the server uses the demo user
        # (config/users.example.json).
        run: python scripts/run_tests.py --install
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: reports/
