# Claude answers when someone writes "@claude" in an issue, a PR comment, an
# inline review comment or a submitted review, e.g. "@claude explain this change"
# or "@claude why did the tests check fail?". Nothing runs without the mention.
#
# No fixed prompt: Claude does what the comment asks, within the read-only
# permissions below (it replies in comments; it can't push commits).
# By default only people with write access to the repo can trigger it.
# Uses the same secret as claude-code-review.yml: CLAUDE_CODE_OAUTH_TOKEN.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write          # lets the action log in through the Claude GitHub App
      actions: read            # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Options: https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
