# Claude reviews every pull request and posts inline comments.
# Runs when a PR is opened, pushed to, marked "Ready for review" or reopened; drafts are skipped.
#
# Setup (once per repo): install the Claude GitHub App and add the secret
# CLAUDE_CODE_OAUTH_TOKEN (run /install-github-app in Claude Code, or
# Settings -> Secrets and variables -> Actions). Nothing here is a credential.
#
# The Claude action only runs if this file is identical on the repository's
# default branch, so it must be committed there too.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push cancels a review still running for the same PR: only the latest
# push is worth reviewing, and each run is a billed Claude call.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Read-only: Claude can comment, but can't push commits or resolve threads.
    # Acting on its feedback stays a manual step, as with a human reviewer.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write          # lets the action log in through the Claude GitHub App
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # Options: https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
