[pytest]
pythonpath = .
testpaths = tests
markers =
    unit: fast, in-process, no network or container required
    api: exercises the running container over HTTPS
    ui: Playwright browser tests against the running container
    serial: must not run alongside other tests (restarts the server, or relies on nobody else writing)

# For failing UI tests, a Playwright trace and screenshot: reports/playwright/<test>/
# (nox runs put them in their own run folder instead; see noxfile.py)
# --strict-markers: a typo in a marker name (e.g. @pytest.mark.seral) is an error,
# not a silently new marker that would let a serial test run in parallel.
addopts = --strict-markers
    --tracing retain-on-failure --screenshot only-on-failure --output reports/playwright

# Logs captured per test (shown for failures in the terminal, and attached to each test in the Allure report)
log_level = INFO
log_format = %(asctime)s %(levelname)-5s %(name)s: %(message)s
log_date_format = %H:%M:%S

# One log file for the whole run, each test marked with START / RESULT lines
log_file = reports/test-run.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-5s %(name)s: %(message)s
log_file_date_format = %H:%M:%S
