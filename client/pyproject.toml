[project]
name = "msgclient"
version = "0.1.0"
description = "CLI and library client for the Secure Message Service"
requires-python = ">=3.10"
dependencies = ["httpx"]

[project.scripts]
msgclient = "msgclient.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
